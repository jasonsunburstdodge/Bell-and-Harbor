name: Build approved concept imagery
on:
  push:
    branches: [main]
    paths:
      - 'tools/crop_concept.py'
      - 'assets/concept.png'
      - '.github/workflows/build-concept-assets.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  crop-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow
      - run: python tools/crop_concept.py
      - name: Commit and push cropped assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/hero-desktop.jpg assets/hero-mobile.jpg assets/feature-brunch.jpg assets/feature-menus.jpg assets/feature-cocktails.jpg assets/feature-events.jpg assets/interior-bar.jpg assets/burger-beer.jpg assets/header-emblem.jpg
          if ! git diff --cached --quiet; then
            git commit -m "Add exact approved concept image crops"
            git push
          fi
