name: Verify deployed Bell and Harbor pages
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'site-style.css'
      - 'site-app.js'
      - 'tools/qa_deployed.mjs'
      - 'tools/check_header_overlap.mjs'
      - 'tools/font-study.mjs'
      - 'index.html'
      - 'menus/**'
      - 'reservations/**'
      - 'private-events/**'
      - 'events/**'
      - 'contact/**'
      - 'order/**'
      - '.github/workflows/visual-qa.yml'
concurrency:
  group: bell-harbor-live-visual-qa
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  visual-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright browser
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Compare candidate serif fonts to approved reference
        run: node tools/font-study.mjs
      - name: Render and inspect public staging
        run: node tools/qa_deployed.mjs
      - name: Measure header bounding boxes at four widths
        continue-on-error: true
        run: node tools/check_header_overlap.mjs
      - name: Build comparison images
        run: |
          python -m pip install Pillow
          python tools/make_comparisons.py
      - name: Commit screenshot evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add qa-screenshots/
          if ! git diff --cached --quiet; then
            git commit -m "Record deployed desktop and mobile visual QA"
            git pull --rebase
            git push
          fi
      - name: Fail verification if any header elements overlap
        run: node -e "const r=require('./qa-screenshots/header-layout.json'); if(r.issues.length){console.error(r.issues.join('\\n')); process.exit(1)}"
      - name: Upload QA artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bell-harbor-visual-qa
          path: qa-screenshots/
