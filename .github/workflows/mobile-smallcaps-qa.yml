name: Mobile small-caps deployed comparison
on:
  push:
    branches: [main]
    paths:
      - 'tools/mobile_compare.mjs'
      - 'tools/mobile_compare.py'
      - '.github/workflows/mobile-smallcaps-qa.yml'
      - 'site-style.css'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: bell-harbor-mobile-smallcaps-qa
  cancel-in-progress: true
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - run: node tools/mobile_compare.mjs
      - run: |
          python -m pip install Pillow
          python tools/mobile_compare.py
      - name: Save post-deployment side-by-side visual evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add qa-screenshots/deployed-mobile-smallcaps.png qa-screenshots/comparison-mobile-smallcaps.jpg
          if ! git diff --cached --quiet; then
            git commit -m "Record verified deployed small-caps mobile comparison"
            git pull --rebase
            git push
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bell-mobile-smallcaps-comparison
          path: |
            qa-screenshots/deployed-mobile-smallcaps.png
            qa-screenshots/comparison-mobile-smallcaps.jpg
